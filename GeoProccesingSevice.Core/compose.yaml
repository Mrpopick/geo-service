name: geo-service-platform

services:
  geo-processing-service:
    image: geo-processing-service:local
    build:
      context: ./GeoProccesingService
      dockerfile: GeoProcessingService.Core.Application/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__GeoProcessing: Data Source=/app/data/geoprocessing.db
      Services__RoutingService__BaseUrl: http://routing-service:8000
    ports:
      - "${GEO_PROCESSING_PORT:-8080}:8080"
    volumes:
      - geo-processing-data:/app/data
    networks:
      - backend
    restart: unless-stopped

  routing-service:
    image: routing-service:local
    build:
      context: ./RoutingService
      dockerfile: Dockerfile
    environment:
      GEOPROCESSING_URL: http://geo-processing-service:8080
      SPATIAL_EXPORT_URL: http://spatial-export-service:8000
      TABLE_EXPORT_URL: http://table-export-service:8000
      ROUTING_DB_PATH: /app/app/data/routing.db
      ROUTE_HISTORY_PATH: /app/app/data/route_history.jsonl
    ports:
      - "${ROUTING_PORT:-8001}:8000"
    volumes:
      - ./RoutingService/app/data:/app/app/data
    depends_on:
      geo-processing-service:
        condition: service_started
      spatial-export-service:
        condition: service_started
      table-export-service:
        condition: service_started
    networks:
      - backend
    init: true
    restart: unless-stopped

  spatial-export-service:
    image: spatial-export-service:local
    build:
      context: ./ExportService
      dockerfile: Dockerfile
    environment:
      EXPORT_DIR: /app/exports
    ports:
      - "${SPATIAL_EXPORT_PORT:-8002}:8000"
    volumes:
      - spatial-export-data:/app/exports
    networks:
      - backend
    init: true
    restart: unless-stopped

  table-export-service:
    image: table-export-service:local
    build:
      context: ./TableExportService
      dockerfile: Dockerfile
    environment:
      EXPORT_DIR: /app/exports
    ports:
      - "${TABLE_EXPORT_PORT:-8003}:8000"
    volumes:
      - table-export-data:/app/exports
    networks:
      - backend
    init: true
    restart: unless-stopped

volumes:
  geo-processing-data:
  spatial-export-data:
  table-export-data:

networks:
  backend:
    driver: bridge
